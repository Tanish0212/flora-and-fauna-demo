<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <title>Counter poster · Flora and Fauna</title>
  <link rel="icon" href="images/icon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Instrument+Sans:wght@400;500;600&amp;family=IBM+Plex+Sans+Arabic:wght@500;700&amp;display=swap">
  <style>
    /* Printable A5 counter poster. Print with "Margins: none" and "Background graphics" on.
       QR codes are static inline SVG, generated locally with segno (see README). */
    @page { size: A5 portrait; margin: 0; }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { background: #D9D6D0; font-family: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif; color: #0E1514; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .toolbar { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; padding: 20px 16px 0; }
    .toolbar button { font: 600 15px "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif; padding: 0 24px; min-height: 44px; border: 0; border-radius: 2px; background: #0E1514; color: #fff; cursor: pointer; }
    .toolbar a { font: 500 15px "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif; color: #0E1514; align-self: center; min-height: 44px; display: inline-flex; align-items: center; }
    .sheet {
      width: 148mm; height: 210mm; margin: 20px auto 40px; background: #F5F6F3;
      padding: 14mm 13mm 11mm; display: flex; flex-direction: column; position: relative; overflow: hidden;
      font-variant-numeric: lining-nums;
    }
    .kicker { margin: 0; font: 600 2.7mm/1.3 "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: .22em; text-transform: uppercase; color: #0F4C45; }
    .name { margin: 3mm 0 0; font: 400 17mm/0.98 "Instrument Serif", Georgia, "Times New Roman", serif; letter-spacing: -0.02em; }
    .ar-name { margin: 2mm 0 0; font: 600 4.6mm/1.4 "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif; direction: rtl; text-align: start; }
    .rule { height: 0; border-top: .25mm solid #0E1514; opacity: .18; margin: 6mm 0 5.5mm; }
    .row { display: flex; gap: 7mm; align-items: center; }
    .qr-box { padding: 2mm; background: #fff; border: .25mm solid rgba(0,0,0,.14); flex: none; }
    .qr { display: block; width: 54mm; height: 54mm; }
    .cta { margin: 0; font: italic 400 6.2mm/1.15 "Instrument Serif", Georgia, "Times New Roman", serif; }
    .cta-ar { margin: 2mm 0 0; font: 500 4mm/1.5 "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif; direction: rtl; color: rgba(0,0,0,.62); }
    .phone { margin: 6mm 0 0; font: 600 7.4mm/1 "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: .01em; font-variant-numeric: lining-nums tabular-nums; }
    .phone-label { margin: 1.6mm 0 0; font: 600 2.4mm "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: .2em; text-transform: uppercase; color: #0F4C45; }
    .foot { margin-top: auto; display: flex; align-items: center; gap: 4mm; padding-top: 4mm; border-top: .25mm solid rgba(0,0,0,.18); }
    .qr-small { display: block; width: 19mm; height: 19mm; flex: none; background: #fff; padding: 1.2mm; box-sizing: content-box; border: .25mm solid rgba(0,0,0,.14); }
    .foot p { margin: 0; font: 400 2.85mm/1.5 "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif; color: rgba(0,0,0,.66); }
    .foot b { font-weight: 600; color: #0E1514; }
    .band { position: absolute; left: 0; right: 0; top: 0; height: 3mm; background: #0F4C45; }
    @media print {
      body { background: none; }
      .toolbar { display: none; }
      .sheet { margin: 0; }
    }
    @media screen and (max-width: 600px) { .sheet { zoom: .62; } }
  </style>
</head>
