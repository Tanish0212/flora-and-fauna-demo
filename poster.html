<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Counter poster · Flora and Fauna</title>
  <link rel="icon" href="images/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&family=Baloo+Bhaijaan+2:wght@400;500;600&display=swap">
  <style>
    /* Printable A5 counter poster. Print with "Margins: none" and "Background graphics" on.
       QR codes are static inline SVG, generated locally with segno (see README). */
    @page { size: A5 portrait; margin: 0; }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { background: #D6E5DE; font-family: "Figtree", Arial, sans-serif; color: #12302F; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .toolbar { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; padding: 20px 16px 0; }
    .toolbar button { font: 500 15px "Figtree", Arial, sans-serif; padding: 0 24px; min-height: 44px; border: 0; border-radius: 999px; background: #0D5C61; color: #fff; cursor: pointer; }
    .toolbar a { font: 500 15px "Figtree", Arial, sans-serif; color: #0D5C61; align-self: center; min-height: 44px; display: inline-flex; align-items: center; }
    .sheet {
      width: 148mm; height: 210mm; margin: 20px auto 40px; background: #F4F7F2;
      padding: 13mm 13mm 11mm; display: flex; flex-direction: column; align-items: center; text-align: center;
      position: relative; box-shadow: 0 20px 60px rgba(0,0,0,.18); overflow: hidden;
      font-variant-numeric: lining-nums;
    }
    .logo { width: 19mm; height: 19mm; position: relative; }
    .name { margin: 3.5mm 0 0; font: 400 11.5mm/1 "Young Serif", Georgia, serif; position: relative; }
    .sub { margin: 2.2mm 0 0; font: 500 2.7mm "Figtree", Arial, sans-serif; letter-spacing: .3em; text-transform: uppercase; color: #0D5C61; position: relative; }
    .ar-name { margin: 1.6mm 0 0; font: 600 4mm/1.4 "Baloo Bhaijaan 2", sans-serif; color: #0D5C61; position: relative; }
    .rule { width: 18mm; height: 0; border-top: 0.35mm solid #0D5C61; margin: 4.5mm 0 4mm; position: relative; }
    .cta { margin: 0; font: 400 6.4mm/1.15 "Young Serif", Georgia, serif; color: #0D5C61; position: relative; }
    .cta-ar { margin: 1.6mm 0 0; font: 500 4mm/1.45 "Baloo Bhaijaan 2", sans-serif; color: #4C6362; position: relative; }
    .qr-box { margin-top: 4.5mm; padding: 2.5mm; background: #fff; border: 0.3mm solid #D3E1D8; border-radius: 1.5mm; position: relative; }
    .qr { display: block; width: 54mm; height: 54mm; }
    .phone { margin: 4.5mm 0 0; font: 500 8.4mm/1 "Figtree", Arial, sans-serif; letter-spacing: .02em; font-variant-numeric: lining-nums tabular-nums; position: relative; }
    .phone-label { margin: 1.6mm 0 0; font: 500 2.6mm "Figtree", Arial, sans-serif; letter-spacing: .24em; text-transform: uppercase; color: #0D5C61; position: relative; }
    .foot {
      margin-top: auto; width: 100%; display: flex; align-items: center; gap: 4mm; text-align: start;
      padding-top: 3.5mm; border-top: 0.25mm solid #D3E1D8; position: relative;
    }
    .qr-small { display: block; width: 19mm; height: 19mm; flex: none; background: #fff; padding: 1.2mm; box-sizing: content-box; border: 0.25mm solid #D3E1D8; }
    .foot p { margin: 0; font: 400 2.85mm/1.45 "Figtree", Arial, sans-serif; color: #4C6362; }
    .foot b { font-weight: 600; color: #12302F; }
    .sheet::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 5mm; background: #0D5C61; }
    .sheet::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 4mm; background: #4E8B3A; }
    .sub { color: #4E8B3A; letter-spacing: .16em; }
    .rule { border-top: .7mm dotted #0D5C61; width: 24mm; }
    .qr-box { border: .6mm solid #0D5C61; border-radius: 1.5mm 1.5mm 5mm 5mm; }
    @media print {
      body { background: none; }
      .toolbar { display: none; }
      .sheet { margin: 0; box-shadow: none; }
    }
    @media screen and (max-width: 600px) {
      .sheet { zoom: .62; }
    }
  </style>
</head>
